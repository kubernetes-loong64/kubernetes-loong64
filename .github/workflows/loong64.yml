name: loong64
on:
  push:
    branches:
      - loong64-*
    tags:
      - release-loong64-*
  pull_request:
    branches:
      - loong64-*

env:
  KUBE_BASE_IMAGE_REGISTRY: ${{ vars.KUBE_BASE_IMAGE_REGISTRY || 'kubernetesloong64' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    outputs:
      PAUSE_TAG: ${{ steps.build-pause.outputs.PAUSE_TAG }}
      PAUSE_VERSION: ${{ steps.build-pause.outputs.PAUSE_VERSION }}
      DOCKER_TAG: ${{ steps.extract.outputs.DOCKER_TAG }}
      RAW_VERSION: ${{ steps.extract.outputs.RAW_VERSION }}
      KUBERNETES_BRANCH: ${{ steps.extract.outputs.KUBERNETES_BRANCH }}
      SERIAL: ${{ steps.extract.outputs.SERIAL }}
      IS_STABLE: ${{ steps.extract.outputs.IS_STABLE }}
    permissions:
      contents: read
    env:
      KUBE_BUILD_PLATFORMS: linux/loong64
      KUBE_RELEASE_RUN_TESTS: n
      BASE_IMAGE_VERSION: v0.21.1
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Print branch name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.base_ref }} (PR target)"
          else
            echo ${{ github.ref_name }}
          fi
      - name: Extract Kubernetes branch
        id: extract
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF=${{ github.base_ref }}
          else
            REF=${{ github.ref_name }}
          fi
          echo "REF=$REF"
          RAW_VERSION=$(echo $REF | awk -F'loong64-' '{print $2}')
          echo "RAW_VERSION=$RAW_VERSION"
          echo "RAW_VERSION=$RAW_VERSION" >> ${GITHUB_OUTPUT}
          KUBERNETES_BRANCH=$(echo $RAW_VERSION | awk -F'+' '{print $1}')
          echo "KUBERNETES_BRANCH=$KUBERNETES_BRANCH"
          echo "KUBERNETES_BRANCH=$KUBERNETES_BRANCH" >> ${GITHUB_ENV}
          echo "KUBERNETES_BRANCH=$KUBERNETES_BRANCH" >> ${GITHUB_OUTPUT}
          DOCKER_TAG=$(echo $RAW_VERSION | sed 's/+/-/g')
          echo "DOCKER_TAG=$DOCKER_TAG"
          echo "DOCKER_TAG=$DOCKER_TAG" >> ${GITHUB_ENV}
          echo "DOCKER_TAG=$DOCKER_TAG" >> ${GITHUB_OUTPUT}
          SERIAL=$(echo $RAW_VERSION | awk -F'+' '{print $2}')
          SERIAL=${SERIAL:-alpha.${{ github.run_number }}}
          echo "SERIAL=$SERIAL"
          echo "SERIAL=$SERIAL" >> ${GITHUB_ENV}
          echo "SERIAL=$SERIAL" >> ${GITHUB_OUTPUT}
          if echo "$RAW_VERSION" | grep -qE '[+].*(alpha|beta|rc)'; then
            IS_STABLE=false
          else
            IS_STABLE=true
          fi
          echo "IS_STABLE=$IS_STABLE"
          echo "IS_STABLE=$IS_STABLE" >> ${GITHUB_OUTPUT}
      - name: Extract CPU architecture
        run: |
          KUBE_CPU_ARCH="${KUBE_BUILD_PLATFORMS##*/}"
          echo "KUBE_CPU_ARCH=$KUBE_CPU_ARCH"
          echo "KUBE_CPU_ARCH=$KUBE_CPU_ARCH" >> ${GITHUB_ENV}
      - name: Install build tools
        run: |
          apt update
          apt install -y git make curl jq file
      - name: Clone Kubernetes
        run: |
          git clone --branch ${{ env.KUBERNETES_BRANCH }} --depth 1 https://github.com/kubernetes/kubernetes.git kubernetes
      - name: ls
        run: ls -lah
      - name: Install loong64 cross-compiler
        run: |
          apt update
          apt install -y gcc-loongarch64-linux-gnu binutils-loongarch64-linux-gnu
      - name: Install Docker CLI
        run: |
          apt remove $(dpkg --get-selections docker.io docker-compose docker-doc podman-docker containerd runc | cut -f1)
          apt update
          apt install -y ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          # Add the repository to Apt sources:
          tee /etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
          Components: stable
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF
          apt update
          apt install -y docker-ce-cli
      - name: Verify Docker installation
        run: |
          ls -la /run/docker.sock 2>/dev/null || echo "/run/docker.sock not found"
          echo "DOCKER_HOST=$DOCKER_HOST"
          docker info
      - name: Apply patches
        working-directory: kubernetes
        run: git apply ../*.patch
      - name: Build pause
        id: build-pause
        working-directory: kubernetes/build/pause
        env:
          ARCH: loong64
          REGISTRY: registry.k8s.io
          USE_LOCAL_CC: 1
        run: |
          echo "=== Before Docker build ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}\t{{.Size}}" | (read -r header; echo "$header"; tail -n +2 | sort -k1,1 -k2,2)
          echo "=== Starting Docker build ==="
          ls -lha
          make container
          echo "=== After build ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}\t{{.Size}}" | (read -r header; echo "$header"; tail -n +2 | sort -k1,1 -k2,2)
          PAUSE_TAG=$(docker images registry.k8s.io/pause --format "{{.Tag}}")
          echo "PAUSE_TAG=$PAUSE_TAG"
          echo "PAUSE_TAG=$PAUSE_TAG" >> $GITHUB_OUTPUT
          PAUSE_VERSION=$(echo $PAUSE_TAG | sed 's/-linux-loong64//')
          echo "PAUSE_VERSION=$PAUSE_VERSION"
          echo "PAUSE_VERSION=$PAUSE_VERSION" >> $GITHUB_OUTPUT
          IMAGE_REF=$(docker images registry.k8s.io/pause --format "{{.Repository}}:{{.Tag}}")
          echo "=== Saving $IMAGE_REF ==="
          docker save -o pause-loong64.tar $IMAGE_REF
          echo "=== Image tarball ==="
          ls -lha pause-loong64.tar
          echo "=== Manifest ==="
          echo "--- repositories ---"
          tar -xOf pause-loong64.tar repositories
          echo "--- manifest.json ---"
          tar -xOf pause-loong64.tar manifest.json | jq
          echo "--- config ---"
          tar -xOf pause-loong64.tar $(tar -xOf pause-loong64.tar manifest.json | jq -r '.[0].Config') | jq
          echo "--- os, architecture ---"
          tar -xOf pause-loong64.tar $(tar -xOf pause-loong64.tar manifest.json | jq -r '.[0].Config') | jq '{os, architecture}'
      - name: Upload pause image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubernetes-loong64-pause
          path: kubernetes/build/pause/pause-loong64.tar
      - name: Build Kubernetes
        working-directory: kubernetes
        run: |
          echo "=== Before Kubernetes build ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}\t{{.Size}}" | (read -r header; echo "$header"; tail -n +2 | sort -k1,1 -k2,2)
          echo "=== Starting Kubernetes build ==="
          make release-in-a-container
          echo "=== After Kubernetes build ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}\t{{.Size}}" | (read -r header; echo "$header"; tail -n +2 | sort -k1,1 -k2,2)
      - name: List build output
        working-directory: kubernetes
        run: find _output \( -path '_output/local/go' -o -path '_output/local/.gimme' -o -path '_output/dockerized/.gimme' -o -path '_output/dockerized/go/cache' -o -path '*LICENSES*' \) -prune -o -type f -exec ls -lh {} \;
      - name: Print binary SHA-256 checksums
        working-directory: kubernetes
        run: |
          find . -type f -name apiextensions-apiserver | xargs sha256sum
          find . -type f -name ginkgo | xargs sha256sum
          find . -type f -name go-runner | xargs sha256sum
          find . -type f -name kubeadm | xargs sha256sum
          find . -type f -name kube-aggregator | xargs sha256sum
          find . -type f -name kube-apiserver | xargs sha256sum
          find . -type f -name kube-controller-manager | xargs sha256sum
          find . -type f -name kubectl | xargs sha256sum
          find . -type f -name kubectl-convert | xargs sha256sum
          find . -type f -name kubelet | xargs sha256sum
          find . -type f -name kube-log-runner | xargs sha256sum
          find . -type f -name kubemark | xargs sha256sum
          find . -type f -name kube-proxy | xargs sha256sum
          find . -type f -name kube-scheduler | xargs sha256sum
          find . -type f -name mounter | xargs sha256sum
      - name: Inspect binary file types
        working-directory: kubernetes
        run: |
          if [ -d _output/local/bin/linux ]; then
            echo "=== _output/local/bin/linux ==="
            file _output/local/bin/linux/*/*
          fi
          if [ -d _output/dockerized/bin/linux ]; then
            echo "=== _output/dockerized/bin/linux ==="
            file _output/dockerized/bin/linux/*/*
          fi
      - name: Inspect release image manifests
        working-directory: kubernetes
        run: |
          if [ ! -d _output/release-images ]; then
            echo "No release images directory found"
            exit 0
          fi
          inspect_tarball() {
            TARBALL="$1"
            if [ ! -f "$TARBALL" ]; then
              echo "=== $TARBALL not found, skipping ==="
              return
            fi
            echo "=== $TARBALL ==="
            ls -lha "$TARBALL"
            echo "--- repositories ---"
            tar -xOf "$TARBALL" repositories
            echo "--- manifest.json ---"
            tar -xOf "$TARBALL" manifest.json | jq
            echo "--- config ---"
            tar -xOf "$TARBALL" $(tar -xOf "$TARBALL" manifest.json | jq -r '.[0].Config') | jq
            echo "--- os, architecture ---"
            tar -xOf "$TARBALL" $(tar -xOf "$TARBALL" manifest.json | jq -r '.[0].Config') | jq '{os, architecture}'
          }
          inspect_tarball _output/release-images/$KUBE_CPU_ARCH/kube-controller-manager.tar
          inspect_tarball _output/release-images/$KUBE_CPU_ARCH/kube-scheduler.tar
          inspect_tarball _output/release-images/$KUBE_CPU_ARCH/kube-apiserver.tar
          inspect_tarball _output/release-images/$KUBE_CPU_ARCH/kubectl.tar
          inspect_tarball _output/release-images/$KUBE_CPU_ARCH/conformance-$KUBE_CPU_ARCH.tar
          inspect_tarball _output/release-images/$KUBE_CPU_ARCH/kube-proxy.tar
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubernetes-loong64-binaries
          path: |
            kubernetes/_output/local/bin/linux/*/*
            !kubernetes/_output/local/bin/linux/*/*.test
            kubernetes/_output/dockerized/bin/linux/*/*
            !kubernetes/_output/dockerized/bin/linux/*/*.test
      - name: Upload container images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubernetes-loong64-images
          path: |
            kubernetes/_output/release-images/*/*

  rpm-anolis:
    needs: build
    runs-on: ubuntu-latest
    container: openanolis/anolisos:23.4
    outputs:
      KUBECTL_ANOLIS_RPM_NAME: ${{ steps.rpm-file.outputs.KUBECTL_ANOLIS_RPM_NAME }}
      ANOLIS_VERSION: ${{ steps.extract-version.outputs.ANOLIS_VERSION }}
    permissions:
      contents: read
    env:
      RAW_VERSION: ${{ needs.build.outputs.RAW_VERSION }}
      DOCKER_TAG: ${{ needs.build.outputs.DOCKER_TAG }}
      SERIAL: ${{ needs.build.outputs.SERIAL }}
      IS_STABLE: ${{ needs.build.outputs.IS_STABLE }}
      ARCH: loongarch64
    steps:
      - name: Install gzip
        run: yum install -y gzip
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Extract version
        id: extract-version
        run: |
          VERSION=$(echo $DOCKER_TAG | awk -F'-' '{print $1}' | sed 's/^v//')
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> ${GITHUB_ENV}
          DIST=$(rpm --eval '%{dist}')
          echo "DIST=$DIST"
          echo "DIST=$DIST" >> ${GITHUB_ENV}
          ANOLIS_VERSION=$(cat /etc/anolis-release | awk '{print $4}' | cut -d'.' -f1)
          echo "ANOLIS_VERSION=$ANOLIS_VERSION"
          echo "ANOLIS_VERSION=$ANOLIS_VERSION" >> ${GITHUB_ENV}
          echo "ANOLIS_VERSION=$ANOLIS_VERSION" >> ${GITHUB_OUTPUT}
      - name: Install build tools
        run: yum install -y rpm-build rpmdevtools
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kubernetes-loong64-binaries
          path: artifacts
      - name: Build kubectl RPM
        id: rpm-file
        run: |
          rm -rf ~/rpmbuild
          rpmdev-setuptree
          find ~/rpmbuild
          KUBE_ARCH="${{ env.ARCH }}"
          # %setup -q -c creates BUILD/kubectl-${VERSION}/ as the working directory
          BUILD_DIR=~/rpmbuild/BUILD/kubectl-$VERSION
          mkdir -p ${BUILD_DIR}/${KUBE_ARCH}
          # Find kubectl binary from artifacts
          find artifacts -type f -name kubectl -exec cp -t ${BUILD_DIR}/${KUBE_ARCH} {} \;
          cp templates/latest/kubectl/LICENSE ${BUILD_DIR}/
          cp templates/latest/kubectl/README.md ${BUILD_DIR}/
          cp templates/latest/kubectl/kubectl.spec ~/rpmbuild/SPECS/
          rpmbuild -ba --target ${{ env.ARCH }} ~/rpmbuild/SPECS/kubectl.spec \
            --define "version ${{ env.VERSION }}" \
            --define "release ${{ env.SERIAL }}"
          mkdir -p rpms
          find ~/rpmbuild/RPMS -name '*.rpm'
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp -t rpms {} +
          KUBECTL_ANOLIS_RPM_NAME=kubectl-${{ env.VERSION }}-${{ env.SERIAL }}${{ env.DIST }}.${{ env.ARCH }}.rpm
          echo "KUBECTL_ANOLIS_RPM_NAME=$KUBECTL_ANOLIS_RPM_NAME"
          echo "KUBECTL_ANOLIS_RPM_NAME=$KUBECTL_ANOLIS_RPM_NAME" >> $GITHUB_OUTPUT
          echo "KUBECTL_ANOLIS_RPM_NAME=$KUBECTL_ANOLIS_RPM_NAME" >> $GITHUB_ENV
          echo "=== RPM file name: $KUBECTL_ANOLIS_RPM_NAME ==="
          sha256sum rpms/$KUBECTL_ANOLIS_RPM_NAME
          echo "=== RPM info ==="
          rpm -qpi rpms/$KUBECTL_ANOLIS_RPM_NAME
          echo "=== RPM contents ==="
          rpm2cpio rpms/$KUBECTL_ANOLIS_RPM_NAME | cpio -it
      - name: Import GPG key
        run: |
          export LANG=C.UTF-8
          echo "${{ secrets.GPG_PRIVATE_KEY_BASE64 }}" | base64 -d | gpg --batch --import > /dev/null
          echo "$(gpg --list-secret-keys --keyid-format LONG | grep -Eo '[A-F0-9]{40}' | head -1):6:" | gpg --import-ownertrust
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec:' | head -1 | cut -d: -f5)
          echo "GPG_KEY_ID=$GPG_KEY_ID"
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV
      - name: Configure rpmmacros
        run: |
          cat > ~/.rpmmacros << EOF
          %_signature gpg
          %_gpg_path ~/.gnupg
          %_gpg_name ${{ env.GPG_KEY_ID }}
          %_gpgbin /usr/bin/gpg2
          %__gpg_sign_cmd %{__gpg} gpg --force-v3-sigs --digest-algo sha256 --batch --no-verbose --no-armor --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}
          EOF
          gpg --armor --export "${GPG_KEY_ID}" > /tmp/gpg-pubkey.asc
          rpm --import /tmp/gpg-pubkey.asc
      - name: Sign kubectl RPM
        run: |
          echo "=== Signing RPM with GPG key: $GPG_KEY_ID ==="
          rpm --addsign rpms/$KUBECTL_ANOLIS_RPM_NAME
          echo "=== Verifying RPM signature ==="
          rpm --checksig rpms/$KUBECTL_ANOLIS_RPM_NAME
          echo "=== RPM file name: $KUBECTL_ANOLIS_RPM_NAME ==="
          sha256sum rpms/$KUBECTL_ANOLIS_RPM_NAME
          echo "=== RPM info ==="
          rpm -qpi rpms/$KUBECTL_ANOLIS_RPM_NAME
          echo "=== RPM contents ==="
          rpm2cpio rpms/$KUBECTL_ANOLIS_RPM_NAME | cpio -it
      - name: Upload kubectl RPM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubernetes-loong64-kubectl-rpm
          path: |
            rpms/${{ env.KUBECTL_ANOLIS_RPM_NAME }}

  deb-debian:
    needs: build
    runs-on: ubuntu-latest
    container: debian:13
    outputs:
      KUBECTL_DEBIAN_DEB_NAME: ${{ steps.deb-file.outputs.KUBECTL_DEBIAN_DEB_NAME }}
      DEBIAN_VERSION_CODENAME: ${{ steps.extract-version.outputs.DEBIAN_VERSION_CODENAME }}
    permissions:
      contents: read
    env:
      RAW_VERSION: ${{ needs.build.outputs.RAW_VERSION }}
      DOCKER_TAG: ${{ needs.build.outputs.DOCKER_TAG }}
      SERIAL: ${{ needs.build.outputs.SERIAL }}
      IS_STABLE: ${{ needs.build.outputs.IS_STABLE }}
      ARCH: loong64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install build tools
        run: |
          apt update
          apt install -y file
      - name: Extract version
        id: extract-version
        run: |
          VERSION=$(echo $DOCKER_TAG | awk -F'-' '{print $1}' | sed 's/^v//')
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> ${GITHUB_ENV}
          ID_VERSION_ID=$(sh -c '. /etc/os-release && echo "${ID}.${VERSION_ID}"')
          echo "ID_VERSION_ID=$ID_VERSION_ID"
          echo "ID_VERSION_ID=$ID_VERSION_ID" >> ${GITHUB_ENV}
          DEBIAN_VERSION_CODENAME=$(sh -c '. /etc/os-release && echo "${VERSION_CODENAME}"')
          echo "DEBIAN_VERSION_CODENAME=$DEBIAN_VERSION_CODENAME"
          echo "DEBIAN_VERSION_CODENAME=$DEBIAN_VERSION_CODENAME" >> ${GITHUB_ENV}
          echo "DEBIAN_VERSION_CODENAME=$DEBIAN_VERSION_CODENAME" >> ${GITHUB_OUTPUT}
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kubernetes-loong64-binaries
          path: artifacts
      - name: Build kubectl DEB
        id: deb-file
        run: |
          PKG_ROOT=$(mktemp -d)
          mkdir -p $PKG_ROOT/usr/bin
          mkdir -p $PKG_ROOT/usr/share/doc/kubectl
          mkdir -p $PKG_ROOT/DEBIAN

          find artifacts -type f -name kubectl -exec install -m 755 {} $PKG_ROOT/usr/bin/kubectl \;
          install -m 644 templates/latest/kubectl/LICENSE $PKG_ROOT/usr/share/doc/kubectl/copyright

          cat > $PKG_ROOT/DEBIAN/control << EOF
          Package: kubectl
          Version: ${{ env.VERSION }}-${{ env.SERIAL }}~${{ env.ID_VERSION_ID }}~${{ env.DEBIAN_VERSION_CODENAME }}
          Architecture: ${{ env.ARCH }}
          Maintainer: 徐晓伟 <xuxiaowei@xuxiaowei.com.cn>
          Description: kubectl (loong64)
           kubectl — Command-line utility for interacting with a Kubernetes cluster,
           built for the loong64 (LoongArch) architecture.
          Homepage: https://github.com/kubernetes-loong64/kubernetes-loong64
          Section: admin
          Priority: optional
          EOF

          mkdir -p debs
          dpkg-deb --build $PKG_ROOT debs/

          find debs -name '*.deb'
          for f in debs/*.deb; do
            new_name=$(echo "$f" | tr '~' '.')
            if [ "$f" != "$new_name" ]; then
              mv "$f" "$new_name"
              echo "Renamed: $f -> $new_name"
            fi
          done
          KUBECTL_DEBIAN_DEB_NAME=kubectl_${{ env.VERSION }}-${{ env.SERIAL }}.${{ env.ID_VERSION_ID }}.${{ env.DEBIAN_VERSION_CODENAME }}_${{ env.ARCH }}.deb
          echo "KUBECTL_DEBIAN_DEB_NAME=$KUBECTL_DEBIAN_DEB_NAME"
          echo "KUBECTL_DEBIAN_DEB_NAME=$KUBECTL_DEBIAN_DEB_NAME" >> $GITHUB_OUTPUT
          echo "KUBECTL_DEBIAN_DEB_NAME=$KUBECTL_DEBIAN_DEB_NAME" >> $GITHUB_ENV
          echo "=== DEB file name: $KUBECTL_DEBIAN_DEB_NAME ==="
          sha256sum debs/$KUBECTL_DEBIAN_DEB_NAME
          echo "=== DEB info ==="
          dpkg --info debs/$KUBECTL_DEBIAN_DEB_NAME
          echo "=== DEB contents ==="
          dpkg --contents debs/$KUBECTL_DEBIAN_DEB_NAME
      - name: Upload kubectl DEB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubernetes-loong64-kubectl-deb
          path: |
            debs/${{ env.KUBECTL_DEBIAN_DEB_NAME }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build, rpm-anolis, deb-debian ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
      DOCKER_TAG: ${{ needs.build.outputs.DOCKER_TAG }}
      PAUSE_TAG: ${{ needs.build.outputs.PAUSE_TAG }}
      PAUSE_VERSION: ${{ needs.build.outputs.PAUSE_VERSION }}
      SERIAL: ${{ needs.build.outputs.SERIAL }}
      IS_STABLE: ${{ needs.build.outputs.IS_STABLE }}
      KUBECTL_ANOLIS_RPM_NAME: ${{ needs.rpm-anolis.outputs.KUBECTL_ANOLIS_RPM_NAME }}
      KUBECTL_DEBIAN_DEB_NAME: ${{ needs.deb-debian.outputs.KUBECTL_DEBIAN_DEB_NAME }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kubernetes-loong64-binaries
          path: loong64-artifacts
      - name: Download container images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kubernetes-loong64-images
          path: loong64-artifacts
      - name: Download pause image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kubernetes-loong64-pause
          path: loong64-artifacts
      - name: Download kubectl RPM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kubernetes-loong64-kubectl-rpm
          path: loong64-artifacts
      - name: Download kubectl DEB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kubernetes-loong64-kubectl-deb
          path: loong64-artifacts
      - name: List downloaded files
        run: find . -type f
      - name: Login to Docker
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Load and push Docker image
        run: |
          echo "=== Before load ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}\t{{.Size}}" | (read -r header; echo "$header"; tail -n +2 | sort -k1,1 -k2,2)
          echo "=== Loading images ==="
          find loong64-artifacts -type f -name '*.tar' | while read -r tarball; do
            echo "--- Loading $tarball ---"
            docker load -i "$tarball"
          done
          echo "=== After load ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}\t{{.Size}}" | (read -r header; echo "$header"; tail -n +2 | sort -k1,1 -k2,2)
          echo "=== Tag and push ==="
          for image in registry.k8s.io/pause registry.k8s.io/kubectl-loong64 registry.k8s.io/kube-controller-manager-loong64 registry.k8s.io/kube-scheduler-loong64 registry.k8s.io/conformance-loong64 registry.k8s.io/kube-apiserver-loong64 registry.k8s.io/kube-proxy-loong64; do
            SRC=$(docker images ${image} --format "{{.Repository}}:{{.Tag}}")
            DST=${{ env.KUBE_BASE_IMAGE_REGISTRY }}/$(echo $image | awk -F/ '{print $NF}' | awk -F'-loong64' '{print $1}'):$(echo $(docker images ${image} --format "{{.Tag}}") | awk -F'-linux' '{print $1}')
            echo "--- Tag $SRC -> $DST ---"
            if [ "${{ env.IS_STABLE }}" = "true" ]; then
              docker tag "$SRC" "$DST"
              docker push "$DST"
            else
              echo "=== Skipping K8s-compatible tag (pre-release) ==="
            fi
            docker tag "$SRC" "$DST"-${{ env.SERIAL }}
            docker push "$DST"-${{ env.SERIAL }}
          done
          echo "=== After push ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}\t{{.Size}}" | (read -r header; echo "$header"; tail -n +2 | sort -k1,1 -k2,2)
      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY_BASE64 }}" | base64 -d | gpg --batch --import > /dev/null
          echo "$(gpg --list-secret-keys --keyid-format LONG | grep -Eo '[A-F0-9]{40}' | head -1):6:" | gpg --import-ownertrust
      - name: Sign artifacts
        run: |
          find loong64-artifacts -type f | while read -r file; do
            gpg --detach-sign --armor "$file"
            echo "Signed: $file"
            gpg --verify "$file".asc "$file"
          done
      - name: List Release files
        run: find loong64-artifacts -type f
      - name: Generate release body
        run: |
          cat > release-body.md <<'BODYEOF'
